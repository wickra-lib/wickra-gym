name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default for the auto-injected GITHUB_TOKEN. The publish jobs
# push to external registries via their own secrets, not the GITHUB_TOKEN, so
# they need no repo write. The jobs that genuinely write through the
# GITHUB_TOKEN (github-release, node-/wasm-publish provenance, attestations)
# declare those rights in their own job-level permissions blocks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io / npm inside any build or publish step
  # retries automatically instead of failing the job.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  # --------------------------------------------------------------------------
  # crates.io: gym-core then the wickra-gym crate (wickra-gym binary)
  # --------------------------------------------------------------------------
  cargo-publish:
    name: Publish to crates.io
    needs: [gate, guard]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Idempotent publishing: if the version is already on crates.io we treat
      # that as success so re-runs of the workflow do not fail.
      - name: Publish gym-core (idempotent)
        run: |
          out=$(cargo publish -p gym-core --token "$CARGO_REGISTRY_TOKEN" 2>&1) && echo "$out" \
            || (echo "$out" | grep -q "already uploaded\|already exists" && echo "skip: already published" \
                || (echo "$out"; exit 1))
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to refresh
        run: sleep 45

      - name: Publish wickra-gym (idempotent)
        run: |
          out=$(cargo publish -p wickra-gym --token "$CARGO_REGISTRY_TOKEN" 2>&1) && echo "$out" \
            || (echo "$out" | grep -q "already uploaded\|already exists" && echo "skip: already published" \
                || (echo "$out"; exit 1))
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Produce .crate files for the GitHub Release attachments.
      - name: Build .crate files for release attachment
        run: |
          cargo package -p gym-core
          cargo package -p wickra-gym

      - name: Upload .crate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-files
          path: target/package/*.crate

      # CycloneDX SBOM per published crate.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --top-level
          mkdir -p sboms
          cp crates/gym-core/gym-core.cdx.json sboms/
          cp crates/wickra-gym/wickra-gym.cdx.json sboms/
          ls -lh sboms/

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/*.cdx.json

  # --------------------------------------------------------------------------
  # PyPI: cross-platform wheels + sdist
  # --------------------------------------------------------------------------
  python-wheels:
    name: Build wheels (${{ matrix.target }}/${{ matrix.manylinux }} on ${{ matrix.os }})
    needs: guard
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Sync root README into bindings/python so it ships with the wheel
        shell: bash
        run: cp README.md bindings/python/README.md
      # The Python binding depends only on gym-core (pure canonicalization +
      # hashing, no native networking), so the manylinux/musllinux containers
      # build the wheel with no extra system dependencies.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*

  python-sdist:
    name: Build Python sdist
    needs: guard
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync root README into bindings/python so it ships in the sdist
        run: cp README.md bindings/python/README.md
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: bindings/python/dist/*

  python-publish:
    name: Publish to PyPI
    timeout-minutes: 45
    needs: [gate, python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Upload to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # --------------------------------------------------------------------------
  # npm: per-platform native binaries + main meta-package
  # --------------------------------------------------------------------------
  node-build:
    name: Node build (${{ matrix.target }})
    needs: guard
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # npm install (not ci): the per-platform optionalDependencies are not yet
      # published, so they are absent from the lock and npm ci would reject it.
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Build native module
        working-directory: bindings/node
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/wickra-gym.*.node
          if-no-files-found: error

  node-publish:
    name: Publish to npm
    timeout-minutes: 45
    needs: [gate, node-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/node/artifacts
          pattern: bindings-*
      # The npm/<platform>/package.json templates are committed (bindings/node/npm/),
      # so `napi artifacts` only drops the freshly built .node binary into the
      # matching directory. napi-rs CLI 3 renamed `--dir` to `--output-dir`.
      - name: Move binaries into platform package layout
        working-directory: bindings/node
        run: npx napi artifacts --output-dir artifacts

      - name: Publish platform packages (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          fail=0
          publish_dir() {
            local dir=$1
            local pkg=$(basename "$dir")
            local pkgname="wickra-gym-$pkg"
            local existing
            existing=$(npm view "$pkgname@$version" version 2>/dev/null)
            if [ "$existing" = "$version" ]; then
              echo "::notice::skip $pkgname@$version (already on npm)"
              return 0
            fi
            echo "::group::publish $pkgname@$version"
            (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
            local rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::first attempt of $pkgname failed (rc=$rc); retrying after 30s"
              sleep 30
              (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
              rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::$pkgname could not be published — the release would land with a missing platform binary; failing the job."
              return 1
            fi
            return 0
          }
          for dir in npm/*/; do
            publish_dir "$dir" || fail=1
          done
          exit $fail

      - name: Sync root README into bindings/node so it ships with the npm tarball
        shell: bash
        run: cp ../../README.md README.md
        working-directory: bindings/node

      - name: Publish main package to npm (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          existing=$(npm view "wickra-gym@$version" version 2>/dev/null)
          if [ "$existing" = "$version" ]; then
            echo "::notice::skip wickra-gym@$version (already on npm)"
            exit 0
          fi
          npm publish --access public --ignore-scripts --provenance
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::first attempt failed (rc=$rc); retrying after 30s"
            sleep 30
            npm publish --access public --ignore-scripts --provenance
            rc=$?
          fi
          exit $rc

      - name: Pack node tarballs for release attachment
        working-directory: bindings/node
        run: |
          npm pack --ignore-scripts
          for d in npm/*/; do
            (cd "$d" && npm pack --ignore-scripts)
          done

      - name: Upload Node tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-tarballs
          path: |
            bindings/node/*.tgz
            bindings/node/npm/*/*.tgz

  # --------------------------------------------------------------------------
  # WASM: wasm-pack build + npm publish (as `wickra-gym-wasm`)
  # --------------------------------------------------------------------------
  wasm-publish:
    name: Publish wickra-gym-wasm to npm
    needs: [gate, wasm-build]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack (latest, via prebuilt binary)
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: wasm-pack
      - name: Build WASM package (bundler target)
        run: wasm-pack build bindings/wasm --target bundler --release
      - name: Enrich generated package.json with author + repo metadata
        working-directory: bindings/wasm/pkg
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.author = 'kingchenc <support@wickra.org>';
            pkg.repository = { type: 'git', url: 'https://github.com/wickra-lib/wickra-gym' };
            pkg.homepage = 'https://github.com/wickra-lib/wickra-gym';
            pkg.bugs = { url: 'https://github.com/wickra-lib/wickra-gym/issues' };
            pkg.license = 'MIT OR Apache-2.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - name: Pack wickra-gym-wasm for release attachment
        working-directory: bindings/wasm/pkg
        run: npm pack
      - name: Upload WASM tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-tarball
          path: bindings/wasm/pkg/wickra-gym-wasm-*.tgz
      - name: Publish wickra-gym-wasm to npm (idempotent)
        working-directory: bindings/wasm/pkg
        run: |
          out=$(npm publish --access public --provenance 2>&1) && echo "$out" \
            || (echo "$out" | grep -q "You cannot publish over" && echo "skip: version already on npm" \
                || (echo "$out"; exit 1))
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --------------------------------------------------------------------------
  # CLI binaries: build the wickra-gym executable per platform on a native
  # runner and attach it to the GitHub Release (in addition to `cargo install`).
  # --------------------------------------------------------------------------
  cli-binaries:
    name: CLI binary (${{ matrix.target }})
    needs: guard
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the CLI binary
        run: cargo build -p wickra-gym --release --target ${{ matrix.target }}
      - name: Package the binary
        shell: bash
        run: |
          set -e
          dir="wickra-gym-${{ matrix.target }}"
          mkdir -p "$dir"
          bin="target/${{ matrix.target }}/release/wickra-gym"
          if [ -f "$bin.exe" ]; then
            cp "$bin.exe" "$dir/"
          else
            cp "$bin" "$dir/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: wickra-gym-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # C ABI native libraries (bindings/c) — built per target, attached to the
  # GitHub Release and consumed by the C#, Java and Go publish jobs.
  # --------------------------------------------------------------------------
  c-abi-build:
    name: C ABI library (${{ matrix.target }})
    needs: guard
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-gym-c --release --target ${{ matrix.target }}
      - name: Package header + libraries
        shell: bash
        run: |
          set -e
          dir="wickra-gym-c-${{ matrix.target }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp bindings/c/include/wickra_gym.h "$dir/include/"
          for f in libwickra_gym.so libwickra_gym.a libwickra_gym.dylib wickra_gym.dll wickra_gym.dll.lib wickra_gym.lib; do
            src="target/${{ matrix.target }}/release/$f"
            [ -f "$src" ] && cp "$src" "$dir/lib/"
          done
          tar -czf "$dir.tar.gz" "$dir"
          echo "packaged $dir:"; ls -lR "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-abi-${{ matrix.target }}
          path: wickra-gym-c-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Pack and publish the .NET binding to NuGet. Authentication uses NuGet Trusted
  # Publishing (OIDC) — no long-lived API key. Configure the trusted-publishing
  # policy on nuget.org (owner KingchenC, repo wickra-lib/wickra-gym,
  # workflow release.yml) for the Wickra.Gym package.
  csharp-publish:
    name: Publish to NuGet
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into runtimes/<rid>/native
        shell: bash
        run: |
          set -e
          declare -A RID=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/csharp/WickraGym/runtimes
          for target in "${!RID[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-gym-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${RID[$target]}/native"; mkdir -p "$dest"
            for f in libwickra_gym.so libwickra_gym.dylib wickra_gym.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${RID[$target]}:"; ls -l "$dest"
          done
      - name: Pack
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 20
          shell: bash
          command: |
            version="${GITHUB_REF_NAME#v}"
            dotnet pack bindings/csharp/WickraGym/WickraGym.csproj -c Release -p:Version="$version" -o nupkg
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login
        with:
          user: KingchenC
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload the NuGet package as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          if-no-files-found: error

  # Publish the Java binding to Maven Central. The org.wickra namespace is
  # verified; auth uses the Sonatype Central token (CENTRAL_USERNAME /
  # CENTRAL_PASSWORD) and artifacts are GPG-signed (GPG_PRIVATE_KEY /
  # GPG_PASSPHRASE). The pom version must match the release tag.
  java-publish:
    name: Publish to Maven Central
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into resources/native/<os>-<arch>
        shell: bash
        run: |
          set -e
          declare -A PLAT=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/java/src/main/resources/native
          for target in "${!PLAT[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-gym-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${PLAT[$target]}"; mkdir -p "$dest"
            for f in libwickra_gym.so libwickra_gym.dylib wickra_gym.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${PLAT[$target]}:"; ls -l "$dest"
          done
      - name: Set up JDK 25 + Maven Central credentials + GPG
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -f bindings/java -Prelease deploy -DskipTests

  # Mirror the in-repo Go module (bindings/go) to the standalone
  # wickra-gym-go repository so `go get
  # github.com/wickra-lib/wickra-gym-go` builds with no extra steps. The
  # in-repo module keeps the prebuilt libraries git-ignored; the mirror commits
  # them per platform under lib/<goos>_<goarch>/ alongside the vendored header.
  # Independent of the GitHub-release job so a Go hiccup never blocks the C/C++
  # asset release. The push uses a fine-grained PAT (GO_MIRROR_TOKEN,
  # contents:write on wickra-gym-go); the mirror is a derived artifact,
  # so its bot commit is intentionally unsigned.
  go-mirror:
    name: Mirror the Go module to wickra-gym-go
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts

      - name: Assemble the wickra-gym-go module tree
        shell: bash
        run: |
          set -e
          out=wickra-gym-go-module
          mkdir -p "$out/include" "$out/lib"
          # Single-package Go source + vendored C ABI header.
          # The tests stay behind: they read the golden corpus from `golden/`
          # above the module, which exists in this repository and not in the
          # mirror -- a consumer running `go test ./...` on the module would get
          # a suite that can never find its fixtures.
          for f in bindings/go/*.go; do
            case "$f" in *_test.go) continue ;; esac
            cp "$f" "$out/"
          done
          cp bindings/go/include/wickra_gym.h "$out/include/"
          cp bindings/go/README.md "$out/"
          # Ship the dual license so pkg.go.dev detects a redistributable license.
          cp LICENSE-MIT LICENSE-APACHE "$out/"
          # Standalone module path (the in-repo go.mod points at the subdir).
          printf 'module github.com/wickra-lib/wickra-gym-go\n\ngo 1.23\n' > "$out/go.mod"
          # Point install instructions at the standalone module path.
          sed -i 's#github.com/wickra-lib/wickra-gym/bindings/go#github.com/wickra-lib/wickra-gym-go#g' \
            "$out/README.md" "$out"/*.go
          # Stage each prebuilt library under lib/<goos>_<goarch>/ (committed in
          # the mirror, unlike the in-repo lib/.gitignore). "<dir> <libfile>".
          declare -A GO=(
            [x86_64-unknown-linux-gnu]="linux_amd64 libwickra_gym.so"
            [aarch64-unknown-linux-gnu]="linux_arm64 libwickra_gym.so"
            [x86_64-apple-darwin]="darwin_amd64 libwickra_gym.dylib"
            [aarch64-apple-darwin]="darwin_arm64 libwickra_gym.dylib"
            [x86_64-pc-windows-msvc]="windows_amd64 wickra_gym.dll"
            [aarch64-pc-windows-msvc]="windows_arm64 wickra_gym.dll"
          )
          for target in "${!GO[@]}"; do
            read -r dir libfile <<< "${GO[$target]}"
            archive=$(find c-abi-artifacts -name "wickra-gym-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            src=$(find "$tmp" -name "$libfile" | head -1)
            if [ -z "$src" ]; then
              echo "::error::missing $libfile for $target"; exit 1
            fi
            mkdir -p "$out/lib/$dir"; cp "$src" "$out/lib/$dir/"
          done
          echo "assembled module:"; find "$out" -type f | sort

      # Nothing compiled the assembled tree before it was pushed. Three steps
      # copied files into place and the fourth published them, so a mirror that
      # did not build -- a header out of step with the library, a missing
      # platform directory, a go.mod that does not resolve standalone -- became
      # `go get`'s problem rather than this workflow's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - name: Build and vet the assembled module before pushing it
        shell: bash
        working-directory: wickra-gym-go-module
        env:
          CGO_ENABLED: "1"
        run: |
          set -e
          # The runner is linux/amd64, so that is the platform whose staged
          # library cgo will link against here. The others are checked by their
          # presence in the tree above, which the assembly step fails without.
          export LD_LIBRARY_PATH="$PWD/lib/linux_amd64:$LD_LIBRARY_PATH"
          go vet ./...
          go build ./...
          go test ./... 2>&1 | tail -20
      - name: Push to wickra-gym-go and tag the release
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.GO_MIRROR_TOKEN }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/wickra-lib/wickra-gym-go.git"
          git clone -q "$remote" mirror-repo
          cd mirror-repo
          git config user.name "wickra-bot"
          git config user.email "support@wickra.org"
          git symbolic-ref HEAD refs/heads/main
          # Replace all tracked content with the freshly assembled tree.
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r ../wickra-gym-go-module/. .
          git add -A
          if git diff --cached --quiet; then
            echo "wickra-gym-go already up to date; tagging only"
          else
            git -c commit.gpgsign=false commit -q -m "Release v$version"
          fi
          git push origin HEAD:refs/heads/main
          git tag "v$version"
          git push origin "v$version"

  # --------------------------------------------------------------------------
  # GitHub Release: create a DRAFT, attach every built artefact, then publish-
  # release flips it to published (immutability-ready ordering).
  # --------------------------------------------------------------------------
  github-release:
    name: Attach assets to the draft GitHub Release
    timeout-minutes: 45
    needs:
      - cargo-publish
      - python-publish
      - node-publish
      - wasm-publish
      - cli-binaries
      - c-abi-build
      - csharp-publish
      - java-publish
      - go-mirror
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve target tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::no v* tag found to attach assets to"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::attaching assets to release $tag"
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          set -e
          mkdir -p release-assets
          find artifacts -type f -name "*.whl" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.node" -exec cp {} release-assets/ \;
          find artifacts -type f -name "wickra-gym-*.tgz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.crate" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.cdx.json" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.nupkg" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          echo "asset-count=$(ls release-assets/ | wc -l)"
      - name: Create / update the draft GitHub Release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: wickra-gym ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: true
          body: |
            wickra-gym ${{ github.ref_name }} — a deterministic, Gymnasium-compatible, microstructure-aware backtest environment with O(1) steps: the dataset is precomputed once into a fixed feature tensor, so every step() is a pure array index for fast, reproducible RL rollouts. Native Rust, Python (a real gymnasium.Env), Node.js, WASM plus a C ABI hub for C, C++, C#, Go, Java, R — every binding produces byte-identical trajectories.

            ### Install

            ```bash
            cargo install wickra-gym
            pip install wickra-gym
            npm install wickra-gym
            dotnet add package Wickra.Gym
            go get github.com/wickra-lib/wickra-gym/bindings/go
            ```

            Java (Maven Central):

            ```xml
            <dependency>
              <groupId>org.wickra</groupId>
              <artifactId>wickra-gym</artifactId>
              <version>${{ steps.tag.outputs.version }}</version>
            </dependency>
            ```

            R (r-universe):

            ```r
            install.packages("wickragym", repos = "https://wickra-lib.r-universe.dev")
            ```

            ### Attached assets

            Pre-built artefacts for every supported platform — the same files this
            workflow run published to crates.io, PyPI, and npm — plus standalone
            CLI binaries and the C ABI libraries. C# ships to NuGet, Java to Maven
            Central, Go via a `bindings/go` subdirectory tag, and R to r-universe
            via their own release jobs.

            ### Auto-generated changelog

            See below; GitHub computes it from the commits since the previous tag.

  # --------------------------------------------------------------------------
  # Build provenance attestations
  # --------------------------------------------------------------------------
  attestations:
    name: Attest build provenance
    timeout-minutes: 45
    needs: [cargo-publish, python-wheels, python-sdist, csharp-publish, java-publish, github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download crate files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-files
          path: artifacts/crates
      - name: Download wheels + sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: artifacts/python
          merge-multiple: true
      # The crates and wheels were attested; the .NET, Java and C ABI artefacts
      # were not. Three of the things this workflow ships had no provenance to
      # be checked against.
      - name: Download the NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/nuget
      - name: Download the jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-jar
          path: artifacts/java
      - name: Download the C ABI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: artifacts/c-abi
          merge-multiple: true
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/crates/*.crate
            artifacts/python/*.whl
            artifacts/python/*.tar.gz
            artifacts/nuget/*.nupkg
            artifacts/java/*.jar
            artifacts/c-abi/*.tar.gz
      - name: Attach provenance bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot attach provenance."
            exit 1
          fi
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::attestation bundle not found at '$BUNDLE'."
            exit 1
          fi
          dest="wickra-gym-${TAG}.provenance.intoto.jsonl"
          cp "$BUNDLE" "$dest"
          echo "Uploading $dest to release $TAG"
          gh release upload "$TAG" "$dest" --clobber --repo "${{ github.repository }}"

  # --------------------------------------------------------------------------
  # Publish the drafted release LAST (immutability-ready).
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish the GitHub Release
    timeout-minutes: 45
    needs: [github-release, attestations]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the draft release to published (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot publish."
            exit 1
          fi
          echo "::notice::publishing release $TAG (draft -> published, latest)"
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"

  gate:
    name: Nothing publishes before this
    needs: [python-wheels, python-sdist, node-build, cli-binaries, c-abi-build, wasm-build]
    runs-on: ubuntu-latest
    # Generous because this job waits for ci.yml to settle on the tagged commit;
    # the wait itself is bounded to 45 minutes inside the step.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: The tagged commit must have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # ci.yml runs on pushes to main and on pull requests, never on a tag,
          # so this workflow cannot see the tag's health in its own run. Ask what
          # the commit itself was graded, which is the merge commit the tag
          # points at and therefore the state that was actually tested.
          #
          # A run that is still going carries conclusion `null`, which reads the
          # same as one that failed -- and a tag pushed straight after its merge
          # lands while ci.yml is still queued. Refusing there turns "tagged a
          # minute early" into a failed release that needs a rerun, so wait for
          # the verdict instead of treating its absence as one. A red conclusion
          # still ends this immediately: only the undecided case waits.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            ci_state=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
                 -q '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "null")"')
            ci_status=${ci_state%% *}
            ci=${ci_state##* }
            if [ "$ci" = "success" ]; then
              break
            fi
            if [ "$ci" != "null" ]; then
              echo "::error::ci.yml on ${SHA} is ${ci}; refusing to publish"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci.yml on ${SHA} did not finish within 45 minutes (${ci_status}); refusing to publish"
              exit 1
            fi
            echo "ci.yml on ${SHA}: ${ci_status} -- waiting"
            sleep 30
          done
          echo "ci.yml on ${SHA}: success"

          # And nothing else that did run may have failed. Listing required
          # workflows by name would go stale -- a path-filtered one legitimately
          # does not run for a version bump -- so the rule is about outcomes
          # rather than about a roster: whatever ran, none of it is red.
          bad=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
                  -q '[.workflow_runs[]
                       | select(.name != "Release")
                       | select(.conclusion == "failure" or .conclusion == "timed_out"
                                or .conclusion == "cancelled")
                       | .name] | unique | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::the tagged commit has failing runs (${bad}); refusing to publish"
            exit 1
          fi
          echo "every workflow that ran on this commit is green"

  # Everything that publishes runs behind this. A `workflow_dispatch` can be
  # started from any ref the actor can see, and every job here pushes to a
  # registry that does not take things back -- so a dispatch from `main` would
  # publish whatever `main` happened to be, under whatever version its manifests
  # happened to carry. Tag pushes satisfy this by construction; a dispatch has to
  # name a tag.

  guard:
    name: Refuse to publish from anything but a tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the ref
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          case "$REF" in
            refs/tags/v*)
              echo "publishing from $REF"
              ;;
            *)
              echo "::error::release.yml publishes to crates.io, PyPI, npm, NuGet and Maven Central, none of which can be undone. It runs on a v* tag; got '$REF'. Re-run this workflow with a tag ref."
              exit 1
              ;;
          esac

  # --------------------------------------------------------------------------
  # crates.io: gym-core then the wickra-gym crate (CLI binary)
  # --------------------------------------------------------------------------

  wasm-build:
    name: Build wickra-gym-wasm
    needs: guard
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain download flakes on the Windows runners often enough that a
      # rerun with no code change is the standard fix. One retry costs half a
      # minute; a failed job costs the whole matrix a rerun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node
        continue-on-error: true
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Pause before retrying the toolchain download
        if: steps.setup_node.outcome == 'failure'
        run: sleep 30
        shell: bash
      - name: Retry the toolchain download
        if: steps.setup_node.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack (latest, via prebuilt binary)
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasm-pack
      - name: Build WASM package (bundler target)
        run: wasm-pack build bindings/wasm --target bundler --release
      - name: Enrich generated package.json with author + repo metadata
        working-directory: bindings/wasm/pkg
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.author = 'kingchenc <support@wickra.org>';
            pkg.repository = { type: 'git', url: 'https://github.com/wickra-lib/wickra-gym' };
            pkg.homepage = 'https://github.com/wickra-lib/wickra-gym';
            pkg.bugs = { url: 'https://github.com/wickra-lib/wickra-gym/issues' };
            pkg.license = 'MIT OR Apache-2.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - name: Pack wickra-gym-wasm for release attachment
        working-directory: bindings/wasm/pkg
        run: npm pack
      - name: Upload WASM tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-tarball
          path: bindings/wasm/pkg/wickra-gym-wasm-*.tgz
